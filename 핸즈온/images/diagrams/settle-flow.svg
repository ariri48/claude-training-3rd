oke="var(--sub)" stroke-width="2" marker-end="url(#ah)"/><rect x="306" y="60" width="120" height="92" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/><text x="366.0" y="92" font-size="13" text-anchor="middle" class="sub">3</text><text x="366.0" y="116" font-size="18" text-anchor="middle" class="b">계산</text><text x="366.0" y="138" font-size="12" text-anchor="middle" class="sub">줄 금액</text><line x1="428" y1="106" x2="442" y2="106" stroke="var(--sub)" stroke-width="2" marker-end="url(#ah)"/><rect x="444" y="60" width="120" height="92" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/><text x="504.0" y="92" font-size="13" text-anchor="middle" class="sub">4</text><text x="504.0" y="116" font-size="18" text-anchor="middle" class="b">명세서</text><text x="504.0" y="138" font-size="12" text-anchor="middle" class="sub">PDF 1장씩</text><line x1="566" y1="106" x2="580" y2="106" stroke="var(--sub)" stroke-width="2" marker-end="url(#ah)"/><rect x="582" y="60" width="120" height="92" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/><text x="642.0" y="92" font-size="13" text-anchor="middle" class="sub">5</text><text x="642.0" y="116" font-size="18" text-anchor="middle" class="b">대조</text><text x="642.0" y="138" font-size="12" text-anchor="middle" class="sub">세금계산서와 비교</text><line x1="704" y1="106" x2="718" y2="106" stroke="var(--sub)" stroke-width="2" marker-end="url(#ah)"/><rect x="720" y="60" width="120" height="92" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/><text x="780.0" y="92" font-size="13" text-anchor="middle" class="sub">6</text><text x="780.0" y="116" font-size="18" text-anchor="middle" class="b">기안</text><text x="780.0" y="138" font-size="12" text-anchor="middle" class="sub">결재 받기</text><line x1="842" y1="106" x2="856" y2="106" stroke="var(--sub)" stroke-width="2" marker-end="url(#ah)"/><rect x="858" y="60" width="120" height="92" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/><text x="918.0" y="92" font-size="13" text-anchor="middle" class="sub">7</text><text x="918.0" y="116" font-size="18" text-anchor="middle" class="b">메일·알림</text><text x="918.0" y="138" font-size="12" text-anchor="middle" class="sub">파트너·팀에 알림</text><path d="M228.0,152 L228.0,200 L268.0,200" fill="none" stroke="var(--red)" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="272.0" y="176" width="300" height="48" rx="10" fill="var(--red-bg)" stroke="var(--red-line)" stroke-width="1.5"/><text x="422.0" y="206" font-size="14" text-anchor="middle" class="b" style="fill:var(--red)">이상한 파트너는 계산하지 않고 차단 · 이유 기록</text><line x1="576.0" y1="200" x2="628.0" y2="200" stroke="var(--red)" stroke-width="2" marker-end="url(#ah)"/><rect x="632.0" y="176" width="190" height="48" rx="10" fill="var(--red-bg)" stroke="var(--red-line)" stroke-width="1.5"/><text x="727.0" y="206" font-size="14" text-anchor="middle" class="b" style="fill:var(--red)">법무검토 요청 (SLAM)</text><text x="272.0" y="246" font-size="13" text-anchor="start" class="sub">정상 건은 1~7을 끝까지 갑니다</text><text x="30" y="286" font-size="18" text-anchor="start" class="b">오늘 Claude Code에게 맡기는 구간</text><rect x="30" y="302" width="672" height="86" rx="10" fill="var(--blue-bg)" stroke="var(--blue-line)" stroke-width="1.5"/><text x="366.0" y="334" font-size="16" text-anchor="middle" class="b" style="fill:var(--blue)">2단계 · 대시보드 만들기</text><text x="366.0" y="360" font-size="13" text-anchor="middle" class="">받기 → 점검 → 계산 → 명세서 → 대조를 한 번에</text><rect x="720" y="302" width="120" height="86" rx="10" fill="var(--amber-bg)" stroke="var(--amber-line)" stroke-width="1.5"/><text x="780.0" y="334" font-size="16" text-anchor="middle" class="b" style="fill:var(--amber)">7단계</text><text x="780.0" y="360" font-size="12" text-anchor="middle" class="">APMS·SLAM 임시저장</text><rect x="858" y="302" width="120" height="86" rx="10" fill="var(--green-bg)" stroke="var(--green-line)" stroke-width="1.5"/><text x="918.0" y="334" font-size="16" text-anchor="middle" class="b" style="fill:var(--green)">4~6단계</text><text x="918.0" y="360" font-size="12" text-anchor="middle" class="">메일 버튼·웹훅</text><text x="30" y="432" font-size="18" text-anchor="start" class="b">사람이 꼭 남기는 결정</text><rect x="30" y="448" width="222" height="84" rx="10" fill="var(--bg)" stroke="var(--red-line)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="141" y="482" font-size="15" text-anchor="middle" class="b">무엇이 이상하면 멈출지</text><text x="141" y="508" font-size="13" text-anchor="middle" class="sub">계획을 읽고 정하기</text><rect x="268" y="448" width="222" height="84" rx="10" fill="var(--bg)" stroke="var(--red-line)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="379" y="482" font-size="15" text-anchor="middle" class="b">다른 금액·차단 건 판단</text><text x="379" y="508" font-size="13" text-anchor="middle" class="sub">고치지 말고 확인</text><rect x="506" y="448" width="222" height="84" rx="10" fill="var(--bg)" stroke="var(--red-line)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="617" y="482" font-size="15" text-anchor="middle" class="b">보내기 전 승인</text><text x="617" y="508" font-size="13" text-anchor="middle" class="sub">"보내"라고 답하기</text><rect x="744" y="448" width="222" height="84" rx="10" fill="var(--bg)" stroke="var(--red-line)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="855" y="482" font-size="15" text-anchor="middle" class="b">상신·등록</text><text x="855" y="508" font-size="13" text-anchor="middle" class="sub">오늘은 임시저장까지만</text><text x="500" y="572" font-size="12" text-anchor="middle" class="sub">교육용 가정입니다. 실제 회사 규칙과 다를 수 있습니다.</text></svg>