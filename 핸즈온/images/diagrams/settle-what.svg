<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="정산이란: 고객이 파트너 서비스를 쓴 만큼, 월말에 계산해 파트너에게 돈을 주는 일"><title>정산이란: 고객이 파트너 서비스를 쓴 만큼, 월말에 계산해 파트너에게 돈을 주는 일</title><style>
